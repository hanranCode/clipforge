name: Desktop Packages

on:
  push:
    branches: ["codex/**"]
    paths: ["src/**", "electron/**", "scripts/**", "package.json", "pnpm-lock.yaml", "next.config.ts", ".github/workflows/desktop-build.yml", ".github/workflows/release.yml"]
  pull_request:
    paths: ["src/**", "electron/**", "scripts/**", "package.json", "pnpm-lock.yaml", "next.config.ts", ".github/workflows/desktop-build.yml", ".github/workflows/release.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-2022
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Install locked dependencies and native tools
        run: pnpm install --frozen-lockfile
      - name: Desktop runtime regression tests
        run: pnpm exec vitest run src/lib/__tests__/desktop-media-tools.test.ts src/lib/__tests__/desktop-runtime.test.ts
      - name: Build native installer
        run: pnpm dist:${{ matrix.platform }} --${{ matrix.arch }}
      - name: Verify installed application, database, media tools and light interface
        env:
          CLIPFORGE_DISPOSABLE_INSTALL: "1"
        run: pnpm desktop:smoke --installer
      - name: Upload installers and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipforge-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/smoke/**
          if-no-files-found: error
          retention-days: 14
